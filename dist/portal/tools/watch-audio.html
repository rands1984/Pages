<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Watch Audio Webhook - 総合ポータルサイト</title>
  <style>:root { --bg: #0d1117; --card-bg: #161b22; --card-border: #30363d; --text: #e6edf3; --text-muted: #8b949e; --accent: #58a6ff; --success: #3fb950; --warning: #d29922; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans JP", sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; min-height: 100vh; }
.container { max-width: 1200px; margin: 0 auto; padding: 24px 16px; }
.header { margin-bottom: 32px; padding-bottom: 16px; border-bottom: 1px solid var(--card-border); }
.header h1 { font-size: 1.8rem; margin-bottom: 8px; }
.header .meta { color: var(--text-muted); font-size: 0.9rem; }
.section { margin-bottom: 40px; }
.section h2 { font-size: 1.3rem; margin-bottom: 16px; display: flex; align-items: center; gap: 12px; }
.section h2::before { content: ""; width: 4px; height: 24px; background: var(--accent); border-radius: 2px; }
.card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
.nav-card { display: inline-flex; align-items: center; gap: 8px; padding: 12px 16px; background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 8px; color: var(--text); text-decoration: none; transition: border-color 0.2s; font-size: 0.9rem; }
.nav-card:hover { border-color: var(--accent); }
.badge { background: var(--warning); color: var(--bg); font-size: 0.7rem; padding: 2px 8px; border-radius: 12px; font-weight: bold; }
.deploy-link { display: inline-flex; align-items: center; gap: 8px; padding: 12px 16px; background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 8px; color: var(--text); text-decoration: none; transition: border-color 0.2s; font-size: 0.9rem; }
.deploy-link:hover { border-color: var(--accent); }
.footer { margin-top: 48px; padding-top: 24px; border-top: 1px solid var(--card-border); color: var(--text-muted); font-size: 0.85rem; text-align: center; }
.card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 12px; padding: 20px; transition: border-color 0.2s; }
.card:hover { border-color: var(--accent); }
.card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 16px; gap: 12px; }
.card-header h3 { font-size: 1.1rem; }
.btn-link { padding: 6px 12px; background: var(--accent); color: var(--bg); border-radius: 6px; text-decoration: none; font-size: 0.8rem; font-weight: 600; white-space: nowrap; }
.btn-link.disabled { background: var(--card-border); color: var(--text-muted); cursor: not-allowed; }
.card-body { display: flex; flex-direction: column; gap: 10px; }
.detail { font-size: 0.85rem; color: var(--text-muted); } .detail strong { color: var(--text); }
.status { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: 600; }
.status.running, .status.active, .status.success { background: rgba(63,185,80,0.2); color: #3fb950; }
.status.pending, .status.scheduled { background: rgba(210,153,34,0.2); color: #d29922; }
.status.stopped, .status.error, .status.failed { background: rgba(248,81,73,0.2); color: #f85149; }
.footer { margin-top: 48px; padding-top: 24px; border-top: 1px solid var(--card-border); color: var(--text-muted); font-size: 0.85rem; text-align: center; }
.empty { text-align: center; padding: 60px 20px; color: var(--text-muted); }
.back-link { color: var(--accent); text-decoration: none; font-size: 0.9rem; display: inline-block; margin-bottom: 16px; }
.back-link:hover { text-decoration: underline; }
.tag { background: var(--card-border); color: var(--text-muted); padding: 2px 8px; border-radius: 4px; font-size: 0.75rem; margin-right: 6px; }
.secret-ref { background: rgba(210,153,34,0.2); color: #d29922; padding: 2px 8px; border-radius: 4px; font-size: 0.75rem; margin-right: 6px; }
.dep { background: rgba(88,166,255,0.2); color: #58a6ff; padding: 2px 8px; border-radius: 4px; font-size: 0.75rem; margin-right: 6px; }
@media (max-width: 600px) { .header h1 { font-size: 1.5rem; } .detail strong { width: auto; display: block; margin-bottom: 4px; } }
    .container { max-width: 900px; margin: 0 auto; padding: 24px 16px; }

    .card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 12px; padding: 24px; margin-bottom: 20px; }
    .detail { margin-bottom: 12px; } .detail strong { color: var(--text); display: inline-block; width: 120px; }
    .tag { background: var(--card-border); color: var(--text-muted); padding: 2px 8px; border-radius: 4px; font-size: 0.75rem; margin-right: 6px; }
    .secret-ref { background: rgba(210,153,34,0.2); color: #d29922; padding: 2px 8px; border-radius: 4px; font-size: 0.75rem; margin-right: 6px; }
    .dep { background: rgba(88,166,255,0.2); color: #58a6ff; padding: 2px 8px; border-radius: 4px; font-size: 0.75rem; margin-right: 6px; }
    .footer { margin-top: 48px; padding-top: 24px; border-top: 1px solid var(--card-border); color: var(--text-muted); font-size: 0.85rem; text-align: center; }
    @media (max-width: 600px) { .header h1 { font-size: 1.5rem; } .detail strong { width: auto; display: block; margin-bottom: 4px; } }
  </style>
</head>
