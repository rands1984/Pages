<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitHub Pages - 総合ポータルサイト</title>
  <style>
    :root { --bg: #0d1117; --card-bg: #161b22; --card-border: #30363d; --text: #e6edf3; --text-muted: #8b949e; --accent: #58a6ff; --success: #3fb950; --warning: #d29922; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans JP", sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; min-height: 100vh; }
    .container { max-width: 1000px; margin: 0 auto; padding: 24px 16px; }
    .header { margin-bottom: 32px; padding-bottom: 16px; border-bottom: 1px solid var(--card-border); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px; }
    .header h1 { font-size: 1.8rem; } .header .meta { color: var(--text-muted); font-size: 0.9rem; }
    .back-link { color: var(--accent); text-decoration: none; font-size: 0.9rem; } .back-link:hover { text-decoration: underline; }
    .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; }
    .card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 12px; padding: 20px; transition: border-color 0.2s; }
    .card:hover { border-color: var(--accent); }
    .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 16px; gap: 12px; }
    .card-header h3 { font-size: 1.1rem; }
    .btn-link { padding: 6px 12px; background: var(--accent); color: var(--bg); border-radius: 6px; text-decoration: none; font-size: 0.8rem; font-weight: 600; white-space: nowrap; }
    .btn-link.disabled { background: var(--card-border); color: var(--text-muted); cursor: not-allowed; }
    .card-body { display: flex; flex-direction: column; gap: 10px; }
    .detail { font-size: 0.85rem; color: var(--text-muted); } .detail strong { color: var(--text); }
    .status { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: 600; }
    .status.running, .status.active, .status.success { background: rgba(63,185,80,0.2); color: #3fb950; }
    .status.pending, .status.scheduled { background: rgba(210,153,34,0.2); color: #d29922; }
    .status.stopped, .status.error, .status.failed { background: rgba(248,81,73,0.2); color: #f85149; }
    .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .tag { font-size: 0.7rem; padding: 2px 8px; border-radius: 12px; background: rgba(88, 166, 255, 0.15); color: var(--accent); }
    .footer { margin-top: 48px; padding-top: 24px; border-top: 1px solid var(--card-border); color: var(--text-muted); font-size: 0.85rem; text-align: center; }
    .empty { text-align: center; padding: 60px 20px; color: var(--text-muted); }
    code { background: rgba(88, 166, 255, 0.1); padding: 2px 6px; border-radius: 4px; font-size: 0.8rem; word-break: break-all; }
    @media (max-width: 600px) { .card-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>GitHub Pages 🌍</h1>
      <div class="meta">2件 · 更新: 2026-09-15 11:34</div>
      <a href="../" class="back-link">← ポータルに戻る</a>
    </div>
    <div class="card-grid"><div class="card"><div class="card-header"><h3>総合ポータルサイト</h3><a href="https://rands1984.github.io/Pages/" target="_blank" class="btn-link">開く</a></div><div class="card-body"><div class="detail"><strong>説明:</strong> 各種ツール・サービスを種類別に一覧できるポータルサイト</div><div class="detail"><strong>使い方:</strong> </div><div class="detail"><strong>ステータス:</strong> <span class="status">公開中</span></div><div class="detail"><strong>ソース:</strong> <code>dist/index.html</code></div><div class="tags"></div></div></div><div class="card"><div class="card-header"><h3>文字起こし（Transcription）</h3><a href="https://rands1984.github.io/Pages/transcription/" target="_blank" class="btn-link">開く</a></div><div class="card-body"><div class="detail"><strong>説明:</strong> 音声の文字起こしを行うWebアプリ（Vite）</div><div class="detail"><strong>使い方:</strong> </div><div class="detail"><strong>ステータス:</strong> <span class="status">公開中</span></div><div class="detail"><strong>ソース:</strong> <code>dist/transcription/index.html</code></div><div class="tags"></div></div></div></div>
    <div class="footer">総合ポータルサイト · Notion「登録サービス一覧」DBから自動生成</div>
  </div>
</body>
</html>
